name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testler:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıklar
        working-directory: agi_trader
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest
      - name: Sözdizimi (tüm paket)
        working-directory: agi_trader
        run: |
          python - <<'PY'
          import ast, glob, sys
          dosyalar = sorted(glob.glob("agi_trader/**/*.py", recursive=True)) + \
                     sorted(glob.glob("scripts/*.py")) + ["cryptomind_serve.py", "trend_daemon.py"]
          for f in dosyalar:
              ast.parse(open(f, encoding="utf-8").read())
          print(f"syntax OK ({len(dosyalar)} dosya)")
          PY
      - name: Test paketi
        working-directory: agi_trader
        env:
          AGI_LIGHT_MODE: "1"
        run: python -m pytest tests/ -q

  katki-dogrulama:
    # Katkı paketi YÜKLENİYOR mu? Bir katkı sessizce düşmüşse PR burada görünür.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıklar
        working-directory: agi_trader
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Katkılar yükleniyor mu
        working-directory: agi_trader
        env:
          AGI_LIGHT_MODE: "1"
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from agi_trader.strategies import sleeves_fast as SF     # yüklemeyi tetikler
          from agi_trader.strategies import contrib as CB
          print("yüklenen katkı:", CB.all_sleeves() or "(yok)")
          if CB.LOAD_ERRORS:
              print("\nYÜKLENEMEYEN KATKILAR:")
              for e in CB.LOAD_ERRORS:
                  print(f"  ✗ {e['modul']}")
                  for h in e["hatalar"]:
                      print(f"      - {h}")
              sys.exit(1)
          # Her katkı SHADOW olmalı — hiçbiri emir veremez.
          from agi_trader.strategies import lifecycle as LC
          for s in CB.all_sleeves():
              assert s in LC.SHADOW_SLEEVES, f"{s} SHADOW değil — katkı emir veremez"
          print("tüm katkılar SHADOW ✓")
          PY
      - name: Statik denetim (katkı kaynakları)
        working-directory: agi_trader
        run: |
          python - <<'PY'
          import sys, glob
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from cm_verify_contribution import statik_denetim
          hatali = 0
          for f in sorted(glob.glob("agi_trader/strategies/contrib/*.py")):
              ad = Path(f).stem
              if ad.startswith("_") or ad.upper() == "SABLON":
                  continue
              b = statik_denetim(Path(f).read_text(encoding="utf-8"), ad)
              if b:
                  hatali += 1
                  print(f"  ✗ {ad}")
                  for x in b:
                      print(f"      - {x}")
              else:
                  print(f"  ✓ {ad}")
          sys.exit(1 if hatali else 0)
          PY
